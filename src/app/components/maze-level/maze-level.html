<div style="text-align: center;">

  <div class="currentLevel">
    <h1>Level {{ currentLevel }}</h1>
    <h1>{{ currentBiome?.name }}</h1>
  </div>

  @if (showMenu) {
    <div class="pauseMenu">
      <h1 (click)="continueGame()">Continue</h1>
      <h1 (click)="openSaveMenu()">Save Game</h1>
      <h1 (click)="goToMainMenu()">Main Menu</h1>
    </div>
  }

  @if (showSaveMenu) {
    <app-save-slots [currentLevel]="currentLevel"
                    [maze]="maze"
                    [playerX]="playerX"
                    [playerY]="playerY"
                    [showSaveMenu]="showSaveMenu"
                    [goalCol]="goalCol"
                    [goalRow]="goalRow"
                    [currentBiome]="currentBiome"
                    [nextLevelBiome]="nextLevelBiome"
                    (closeSaveMenu)="showSaveMenu = false"
    />
  }

  <section>
    <canvas id="maze"></canvas>
  </section>



  @if (showEasterEgg) {
    <video autoplay class="videoEasterEgg" src="assets/video/eastereggvideo.mp4"></video>
  }

  @if (showItemModal) {
    <div class="item-modal">
      <div class="item-modal-content">
        <h2>You found a {{ pickedItem?.name }}!</h2>
        <p>{{ pickedItem?.description }}</p>
        <button (click)="closeItemModal()">Close</button>
      </div>
    </div>
  }


</div>
