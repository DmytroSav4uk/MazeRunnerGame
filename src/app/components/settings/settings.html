<div class="menu">
  <div class="settings">
    <button (click)="publicFunc.redirectTo('menu')" class="closeButton">X</button>

    <form [formGroup]="form" class="settings-form">

      <h1>Audio</h1>

      <div class="section">
        <label>Loudness: {{ form.value.volume }}%</label>
        <input type="range" formControlName="volume" min="0" max="100" />
      </div>
      <hr />
      <h1>Difficulty</h1>

      <div class="section difficulties">
        @for (diff of difficulties; track diff) {
          <label>
            <input
              type="radio"
              formControlName="difficulty"
              [value]="diff"
            />
            {{ diff }}
          </label>
        }
      </div>
      <hr />
      <h1>Controls</h1>
      <hr />
      <div class="section controls" formGroupName="controls">
        @for (ctrl of controlNames; track ctrl) {
          <div class="control-row">
            <label>{{ ctrl }}</label>
            <input
              type="text"
              [formControlName]="ctrl"
              readonly
            />
            <button type="button" (click)="bindKey(ctrl)">Bind</button>
          </div>
        }
      </div>

    </form>
  </div>
</div>
